<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Par🇮🇹le - Classifica</title>
    <meta name="theme-color" content="#6aaa64" />
    <link href="../images/parle_logo_32x32.png" rel="icon shortcut" sizes="32x32" />
    <link href="../images/parle_logo_192x192.png" rel="apple-touch-icon" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Same theme settings as the game.
      try {
        if (JSON.parse(localStorage.getItem("darkTheme"))) document.documentElement.classList.add("nightmode");
        if (JSON.parse(localStorage.getItem("colorBlindTheme"))) document.documentElement.classList.add("colorblind");
      } catch (e) {}
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <a class="back" href="../" title="Torna al gioco" aria-label="Torna al gioco">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
      </a>
      <h1>Classifica</h1>
      <button id="logout" class="link" hidden>Esci</button>
    </header>

    <main id="app">
      <p class="muted center">Caricamento...</p>
    </main>
  </body>
</html>
