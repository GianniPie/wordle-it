<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Par🇮🇹le - Classifica</title>
    <meta name="theme-color" content="#538d4e" />
    <link href="../images/parle_logo.svg" rel="icon" type="image/svg+xml" />
    <link href="../images/parle_logo_32x32.png" rel="icon" sizes="32x32" />
    <link href="../images/parle_logo_192x192.png" rel="apple-touch-icon" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Same theme settings as the game.
      try {
        // Same theme as the game: chosen light/dark, or the phone's setting ("Sistema") when nothing is chosen.
        var dark = JSON.parse(localStorage.getItem("darkTheme"));
        if (dark === true || (dark !== false && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("nightmode");
        if (JSON.parse(localStorage.getItem("colorBlindTheme"))) document.documentElement.classList.add("colorblind");
      } catch (e) {}
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js" defer></script>
    <script type="module" src="app.js"></script>
    <!-- Keeps a copy of the app on the device so it also works without network -->
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
    </script>
  </head>
  <body>
    <header>
      <div class="menu-slot">
        <button id="menu-button" class="icon" aria-label="Menu" aria-expanded="false" aria-controls="menu">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="var(--color-tone-3)" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
      </div>
      <a class="title" href="../">PAR🇮🇹LE</a>
      <div class="menu-slot" id="account-slot"></div>
      <nav id="menu" hidden></nav>
    </header>

    <main id="app">
      <p class="muted center">Caricamento...</p>
    </main>
  </body>
</html>
